<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>바사삭! — 3D 사진 조각</title>
<meta name="description" content="사진 속 파란 고양이를 Voro++ 보로노이 셀로 재현한 인터랙티브 모자이크.">
<link rel="stylesheet" href="style.css?v=wave-1">
</head>
<body>
<main>
<section class="art-section" aria-label="인터랙티브 3D 사진 조각"><div class="art"><canvas id="canvas" width="1472" height="1474" role="img" aria-label="보로노이 다각형으로 재현한 파란 고양이"></canvas><div id="loading" role="status">조각들을 모으는 중…</div><div id="error" role="alert" hidden>이미지를 불러오지 못했습니다. <button onclick="location.reload()">다시 시도</button></div></div></section>
<section class="controls" aria-label="조각 설정"><div class="sliders"><div class="density"><div class="control-title"><label for="density">조각 수</label><output id="density-value" for="density">100 조각</output></div><input id="density" type="range" min="0" max="7" step="1" value="3"><div class="range-labels"><span>10개</span><span>14,400개</span></div></div><div class="density"><div class="control-title"><label for="spread">분리 거리</label><output id="spread-value" for="spread">50%</output></div><input id="spread" type="range" min="0" max="100" step="1" value="50"><div class="range-labels"><span>모이기</span><span>흩어지기</span></div></div></div><div class="actions"><button id="wave" aria-pressed="false" disabled>파동 준비 중…</button><button id="reset-view" type="button">정면 보기 ⤾</button><button id="play" aria-pressed="false">자동 재생 ▷</button><button id="scatter" aria-pressed="true">모이기 ↙</button><button id="edges" aria-pressed="false"><span class="button-icon">⬡</span> 조각 경계</button><button id="compare" aria-pressed="false"><span class="button-icon">◐</span> 원본 비교</button><button id="save" class="save">PNG 저장 <span>↓</span></button></div></section>
</main>
<div hidden><button id="upload"></button><button id="reset-image" hidden></button><input id="image-file" type="file" accept="image/*"><p id="file-status"></p><span class="live"></span><span id="mode-label"></span><div class="art-bottom"><span></span><span id="cell-count"></span></div></div>
<script src="vendor/polygon-clipping.js"></script>
<script type="module" src="app.js?v=wave-1"></script>
</body></html>
